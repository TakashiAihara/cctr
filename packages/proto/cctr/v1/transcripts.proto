syntax = "proto3";

package cctr.v1;

import "google/protobuf/timestamp.proto";

// One machine's transcripts, read-only. The same contract whether the caller
// is the CLI on another machine, the Web UI, or ccx pulling machines together.
//
// Facts only: what the transcript files say, never what to do about them.
service TranscriptService {
  // What this cctr is: version, schema version, machine.
  rpc GetMeta(GetMetaRequest) returns (GetMetaResponse);

  // Sessions on this machine, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // One session by id, a unique prefix of one, or `latest`.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // The records of one session as they are on disk, one JSONL line each.
  // Streamed: sessions of tens of megabytes exist.
  rpc ReadRecords(ReadRecordsRequest) returns (stream ReadRecordsResponse);

  // Sessions whose transcript text matches a query, newest first. Streamed: one
  // message per session, so a fleet-wide search does not wait for the slowest host.
  rpc Search(SearchRequest) returns (stream SearchResponse);
}

message GetMetaRequest {}

message GetMetaResponse {
  // Always "cctr".
  string name = 1;
  string version = 2;
  // Bumped when Session or the record shape changes incompatibly.
  uint32 schema_version = 3;
  // hostname unless CCX_MACHINE overrides it.
  string machine = 4;
  string projects_dir = 5;
  // The serving process, so a CLI on the same machine can check it is talking
  // to the agent it started.
  uint32 pid = 6;
}

message Usage {
  uint64 input = 1;
  uint64 output = 2;
  uint64 cache_read = 3;
  uint64 cache_create = 4;
}

// One transcript session: a JSONL file, aggregated in one pass.
message Session {
  string id = 1;
  string file = 2;
  string cwd = 3;
  string git_branch = 4;
  // Claude Code version that wrote it.
  string version = 5;
  string entrypoint = 6;
  string title = 7;
  string last_prompt = 8;
  google.protobuf.Timestamp first_ts = 9;
  google.protobuf.Timestamp last_ts = 10;
  uint64 duration_ms = 11;
  uint64 records = 12;
  uint64 user_turns = 13;
  uint64 assistant_msgs = 14;
  repeated string models = 15;
  Usage usage = 16;
  // tool name -> call count
  map<string, uint64> tools = 17;
  uint64 size_bytes = 18;
  google.protobuf.Timestamp mtime = 19;
}

message ListSessionsRequest {
  // Empty means no filter.
  string cwd = 1;
  // Only sessions with a record at or after this time.
  google.protobuf.Timestamp since = 2;
  // 0 means no limit.
  uint32 limit = 3;
}

message ListSessionsResponse {
  // last_ts newest first.
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ReadRecordsRequest {
  string id = 1;
}

// One JSONL line, verbatim. Kept opaque so the wire format never has to know
// what Claude Code put in the record; the reader parses it with the same
// parser as a local file.
message ReadRecordsResponse {
  string line = 1;
}

message SearchRequest {
  // Matched as a substring of each content block, case-insensitively.
  string query = 1;
  // The query is a JavaScript RegExp source; an uncompilable one is InvalidArgument.
  bool regex = 2;
  // Compare case-sensitively; without it a regex gets the "i" flag.
  bool case_sensitive = 3;
  // "user", "assistant", or empty for both sides.
  string role = 4;
  // Also search assistant thinking blocks.
  bool thinking = 5;
  // Also search assistant tool_use blocks.
  bool tools = 6;
  // Chars kept either side of the match in an excerpt; 0 means the default of 60.
  uint32 context = 7;
  // Hits kept per session; total still counts them all. 0 means every hit.
  uint32 hits_per_session = 8;
  // Sessions returned; 0 means no limit.
  uint32 limit = 9;
  // One session: an id, a unique prefix, or `latest`.
  string session = 10;
  // Only sessions whose cwd is exactly this path.
  string cwd = 11;
  // Only sessions with a record at or after this time.
  google.protobuf.Timestamp since = 12;
}

// One matching block of one record.
message SearchHit {
  // uuid of the record; empty when the record has none.
  string uuid = 1;
  // timestamp of the record, verbatim; empty when the record has none.
  string ts = 2;
  // "user" or "assistant".
  string role = 3;
  // "text", "thinking" or "tool_use".
  string kind = 4;
  // The match with context chars either side, whitespace collapsed.
  string excerpt = 5;
}

message SearchResponse {
  Session session = 1;
  // Matching blocks in the session, whether or not hits kept them all.
  uint64 total = 2;
  repeated SearchHit hits = 3;
}
